<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WayPAY Premium Explainer Library</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"><style>*{font-family:Inter,system-ui,sans-serif}body{margin:0;background:linear-gradient(135deg,#fff,#ecfdf5,#f8fafc);color:#0f172a}.card{display:block;background:white;border:2px solid #e2e8f0;border-radius:24px;padding:20px;text-decoration:none;color:inherit;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#10b981;box-shadow:0 24px 70px rgba(15,23,42,.12)}.tag{display:inline-flex;border-radius:999px;background:#ecfdf5;color:#047857;padding:7px 12px;font-weight:900;font-size:12px}</style></head><body><main class="max-w-7xl mx-auto px-5 py-12"><header class="text-center max-w-4xl mx-auto"><span class="tag">WayPAY Premium Explainers</span><h1 class="mt-6 text-5xl md:text-7xl font-black tracking-tight leading-none">Full premium explainer library</h1><p class="mt-6 text-xl text-slate-600">Each item opens a premium animated explainer with branch or feature specific photo direction, flow, UI mockup and content.</p></header><section id="grid" class="mt-12 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></section></main><script>const items=[['frisor-salon-booking.html','Frisor and salon'],['barber-booking.html','Barber'],['beauty-salon-booking.html','Beauty salon'],['nail-studio-booking.html','Nail studio'],['physiotherapy-booking.html','Physiotherapy'],['therapy-booking.html','Therapy'],['fitness-traening-booking.html','Fitness'],['yoga-pilates-booking.html','Yoga and Pilates'],['consultant-coach-booking.html','Consultant and coach'],['viewer.html#education','Courses and education'],['service-agreements.html','Service agreements'],['garden-service.html','Garden service'],['roof-service.html','Roof service'],['workshop.html','Workshop'],['bike-rental.html','Bike rental'],['equipment-rental.html','Equipment rental'],['pet-care.html','Pet care'],['portrait-sessions.html','Photo sessions'],['booking-feature.html','Online booking feature'],['viewer.html#prepayment','Prepayment feature'],['reminders-feature.html','Automatic reminders'],['viewer.html#bookingWebsite','Booking website feature'],['viewer.html#rentalDeposit','Rental deposit feature'],['subscriptions-feature.html','Subscriptions feature']];grid.innerHTML=items.map((x,i)=>`<a class="card" href="explainers/${x[0]}"><span class="tag">${i+1}</span><h2 class="mt-4 text-2xl font-black">${x[1]}</h2><p class="mt-2 text-slate-600">Open premium animated WayPAY explainer.</p></a>`).join('')</script></body></html>
