<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WayPAY Explainer Library</title><meta name="description" content="WayPAY statiske HTML explainers med konfigurator, animationer, visuals, infografik, SEO og AEO."><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"><style>*{font-family:Inter,system-ui,sans-serif}body{margin:0;background:linear-gradient(135deg,#fff,#ecfdf5,#f8fafc);color:#0f172a}.card{transition:.22s;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:#10b981;box-shadow:0 24px 70px #0f172a1f}.card.active{background:#ecfdf5;border-color:#059669}.scene{display:none;min-height:100vh;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:80px 24px 120px}.scene.active{display:flex}.fade{animation:fade .65s both}@keyframes fade{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}.orb{position:absolute;border-radius:999px;filter:blur(40px);opacity:.5;animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-18px)}}.voice{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:min(860px,calc(100vw - 32px));background:#fffffff2;border:1px solid #e2e8f0;border-radius:24px;padding:16px 22px;box-shadow:0 22px 70px #0f172a24;z-index:30;text-align:center;font-weight:700}.progress{position:fixed;left:24px;right:24px;bottom:18px;height:6px;border-radius:999px;background:#e2e8f0;z-index:31;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#059669,#10b981,#22c55e)}.controls{position:fixed;right:18px;top:18px;z-index:35;display:flex;gap:10px}.controls button,.back{background:#fffffff2;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0f172a14;font-weight:900}.back{position:fixed;left:18px;top:18px;z-index:35}.photo{position:relative;min-height:260px;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,#fff,#f1f5f9);border:1px solid #e2e8f0;box-shadow:0 30px 80px #0f172a1c}.photo:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,var(--light),transparent 30%),radial-gradient(circle at 25% 20%,#fff,transparent 24%)}.person{position:absolute;width:58px;height:88px;border-radius:999px 999px 26px 26px;background:var(--accent);top:35%;box-shadow:0 18px 50px #0f172a24}.person:before{content:'';position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:#fde68a;border:3px solid white}.p1{left:18%;transform:rotate(-7deg)}.p2{left:44%;background:#334155}.p3{right:18%;transform:rotate(7deg);background:#64748b}.table{position:absolute;left:12%;right:12%;bottom:17%;height:35%;border-radius:28px;background:#ffffffb8;border:1px solid #fff;box-shadow:0 18px 50px #0f172a1a}.info{background:#0f172a;color:white;border-radius:34px;padding:26px;box-shadow:0 30px 90px #0f172a33}.node{background:#ffffff14;border:1px solid #ffffff20;border-radius:24px;padding:18px}.num{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-weight:900;margin-bottom:10px}.phone{width:250px;border:8px solid #111827;border-radius:40px;background:white;overflow:hidden;box-shadow:0 35px 90px #0f172a44}.top{height:28px;background:#111827}.pill{background:#ecfdf5;color:#047857;border-radius:999px;padding:8px 13px;font-weight:900;font-size:13px}</style><script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"WayPAY Explainer Library","applicationCategory":"BusinessApplication","operatingSystem":"Web"}</script></head><body><main id="app"></main><script>const D=[['frisor','Frisør & salon','fa-scissors','#e11d48','#fff1f2','Færre no-shows med booking og betaling i ét flow','Saloner taber tid på udeblivelser, beskeder og manuel betaling.'],['barber','Barber','fa-scissors','#334155','#f8fafc','Bookinger og betaling uden ekstra beskeder','Barbere har brug for hurtig booking uden ekstra administration.'],['beauty','Beauty salon','fa-star','#e11d48','#fff1f2','Sælg behandlinger, pakker og tider online','Beauty-virksomheder sælger tid, tillid og gentagne behandlinger.'],['nails','Nail studio','fa-diamond','#db2777','#fdf2f8','Gør faste tider og gentagne kunder lettere at styre','Nail studios har mange gentagne bookinger og små ændringer.'],['physio','Fysioterapi','fa-heartbeat','#059669','#ecfdf5','Book sessioner og forløb med mere struktur','Behandlingsforløb kræver overblik over tider og gentagelser.'],['therapy','Psykolog / terapeut','fa-comments','#2563eb','#eff6ff','Tryg booking af samtaler og sessioner','Samtaleforløb kræver klarhed, tillid og diskretion.'],['fitness','Fitness & træning','fa-heartbeat','#ea580c','#fff7ed','Hold, træning og betaling i ét system','Fitness kræver styr på kapacitet, hold og betaling.'],['yoga','Yoga / Pilates','fa-leaf','#7c3aed','#f5f3ff','Sælg hold, klippekort og kursusforløb enkelt','Små hold kræver tydelig kapacitet og nem tilmelding.'],['consultant','Konsulent / coach','fa-comments-o','#2563eb','#eff6ff','Sælg tid og sessioner uden kalenderkaos','Rådgivere mister tid på koordinering før arbejdet starter.'],['education','Kurser & undervisning','fa-graduation-cap','#d97706','#fffbeb','Sælg kursuspladser og undervisning online','Kurser kræver tilmelding, betaling og deltagerstyring.'],['cleaning','Rengøring & service','fa-magic','#0891b2','#ecfeff','Automatiser faste serviceaftaler og betaling','Serviceaftaler kræver gentagelser, planlægning og betaling.'],['garden','Haveservice','fa-tree','#059669','#ecfdf5','Book sæsonarbejde og servicebesøg online','Haveservice varierer efter sæson, opgave og kundens behov.'],['roof','Tagservice','fa-home','#d97706','#fffbeb','Book inspektioner og servicebesøg med klarhed','Tagservice starter ofte med inspektion, aftale og opfølgning.'],['auto','Værksted / autoservice','fa-car','#334155','#f8fafc','Book service, reparation og betaling nemmere','Værksteder skal styre tid, opgave og kundekommunikation.'],['bike-rental','Cykeludlejning','fa-bicycle','#16a34a','#f0fdf4','Udlej cykler med booking, depositum og returflow','Udlejning kræver styr på udstyr, perioder og sikkerhed.'],['equipment','Udstyr / maskinudlejning','fa-wrench','#334155','#f8fafc','Styr udstyr, lager og depositum online','Maskinudlejning kræver præcis tilgængelighed og ansvar.'],['pet','Pet care','fa-paw','#e11d48','#fff1f2','Book pasning og serviceaftaler tydeligt','Pet care kræver tillid, tydelige tider og gentagne aftaler.'],['photo','Fotograf','fa-camera','#4f46e5','#eef2ff','Sælg fotosessioner og depositum nemt','Fotosessioner kræver tid, planlægning og commitment.'],['online-booking','Online Booking','fa-calendar-check-o','#059669','#ecfdf5','Sådan fungerer online booking i WayPAY','Kunden vælger ydelse, tid og får bekræftelse.'],['prepayment','Forudbetaling','fa-credit-card','#2563eb','#eff6ff','Hvorfor betaling ved booking reducerer no-shows','Forudbetaling skaber commitment og bedre cashflow.'],['reminders','Automatiske påmindelser','fa-bell','#d97706','#fffbeb','Automatiske beskeder før aftalen','Påmindelser reducerer manuel opfølgning og tvivl.'],['website','Booking Website','fa-globe','#7c3aed','#f5f3ff','Din booking forklaret på én klar side','En bookingwebsite samler forklaring og handling.'],['deposit','Rental Deposit','fa-lock','#16a34a','#f0fdf4','Depositum og sikkerhed for udlejning','Depositum, returflow og skader bliver tydelige.'],['subscription','Abonnementer','fa-repeat','#2563eb','#eff6ff','Tilbagevendende betalinger uden manuel opfølgning','Medlemskaber og planer kører mere automatisk.']];let cur=D[0],scene=0,play=true,timer,pt;function overview(){app.innerHTML=`<section class="min-h-screen px-5 py-12"><div class="max-w-7xl mx-auto"><div class="text-center max-w-4xl mx-auto"><span class="pill"><i class="fa fa-credit-card"></i> WayPAY Explainer Library</span><h1 class="mt-7 text-5xl md:text-7xl font-black tracking-tight leading-none">Find den rigtige animerede explainer</h1><p class="mt-6 text-xl text-slate-600">Vælg branche eller feature. Hver explainer bruger scener, animationer, photo-style visuals, infografik, SEO og AEO struktur.</p></div><div class="mt-10 bg-white/90 border border-slate-200 rounded-[2rem] p-5 shadow-xl"><input id="q" class="w-full rounded-2xl border-2 border-slate-200 px-5 py-4 font-bold outline-none focus:border-emerald-500" placeholder="Søg fx frisør, udlejning, betaling..."></div><div id="grid" class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div></div></section>`;renderCards();q.oninput=renderCards}function renderCards(){let s=(q?.value||'').toLowerCase(),g=document.getElementById('grid');g.innerHTML=D.filter(x=>!s||x.join(' ').toLowerCase().includes(s)).map((x,i)=>`<button onclick="start('${x[0]}')" class="card text-left bg-white border-2 border-slate-200 rounded-[1.6rem] p-5 shadow-sm"><div class="flex gap-4"><div class="w-13 h-13 rounded-2xl flex items-center justify-center" style="background:${x[4]};color:${x[3]}"><i class="fa ${x[2]} text-2xl"></i></div><div><div class="text-xs font-black text-emerald-700">EXPLAINER</div><h3 class="text-xl font-black mt-1">${x[1]}</h3><p class="text-slate-500 mt-2 text-sm leading-relaxed">${x[5]}</p></div></div></button>`).join('')}function start(id){cur=D.find(x=>x[0]==id)||D[0];scene=0;play=true;show()}function shell(){return `<a class="back" onclick="overview()"><i class="fa fa-arrow-left"></i> Oversigt</a><div class="controls"><button onclick="prev()"><i class="fa fa-step-backward"></i></button><button onclick="toggle()" id="pb"><i class="fa fa-pause"></i></button><button onclick="next()"><i class="fa fa-step-forward"></i></button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="voice" id="voice"></div>`}function scenes(){let [id,t,ic,a,l,h,p]=cur;document.body.style.setProperty('--accent',a);document.body.style.setProperty('--light',l);return [`<section class="scene active" style="background:linear-gradient(135deg,#fff,${l},#f8fafc)"><div class="orb w-96 h-96 -top-24 -right-24" style="background:${a}33"></div><div class="max-w-5xl text-center"><div class="fade inline-flex items-center gap-3 mb-7"><div class="w-16 h-16 rounded-2xl text-white grid place-items-center shadow-xl" style="background:${a}"><i class="fa ${ic} text-3xl"></i></div><div class="text-left"><h1 class="text-4xl font-black">WayPAY</h1><p class="font-black" style="color:${a}">${t} Explainer</p></div></div><h2 class="fade text-5xl md:text-7xl font-black leading-none">${h}</h2><p class="fade mt-7 text-xl md:text-2xl text-slate-600 max-w-3xl mx-auto">${p}</p><div class="fade mt-10 grid md:grid-cols-3 gap-5"><div class="bg-white p-7 rounded-3xl shadow-xl"><b class="text-5xl" style="color:${a}">0 kr.</b><p class="font-bold text-slate-500">opstart</p></div><div class="bg-white p-7 rounded-3xl shadow-xl"><b class="text-5xl" style="color:${a}">0 kr.</b><p class="font-bold text-slate-500">månedligt</p></div><div class="bg-white p-7 rounded-3xl shadow-xl"><b class="text-5xl" style="color:${a}">8%</b><p class="font-bold text-slate-500">ved salg</p></div></div></div></section>`,`<section class="scene active bg-white"><div class="max-w-7xl grid lg:grid-cols-2 gap-12 items-center"><div><span class="pill">Problemet</span><h2 class="fade mt-6 text-5xl md:text-6xl font-black leading-none">${p}</h2><p class="fade mt-6 text-xl text-slate-600">Manuelle aftaler, beskeder og betaling skaber friktion. Explaineren gør værdien tydelig på få sekunder.</p></div><div class="space-y-5"><div class="photo fade"><div class="person p1"></div><div class="person p2"></div><div class="person p3"></div><div class="table"></div></div><div class="grid grid-cols-3 gap-3"><div class="bg-white rounded-2xl p-4 shadow"><b style="color:${a}">↓</b><p class="text-xs font-black text-slate-500">mindre admin</p></div><div class="bg-white rounded-2xl p-4 shadow"><b style="color:${a}">✓</b><p class="text-xs font-black text-slate-500">klart flow</p></div><div class="bg-white rounded-2xl p-4 shadow"><b style="color:${a}">kr.</b><p class="text-xs font-black text-slate-500">betaling</p></div></div></div></div></section>`,`<section class="scene active bg-slate-950 text-white"><div class="max-w-7xl grid lg:grid-cols-2 gap-16 items-center"><div class="flex justify-center"><div class="phone fade"><div class="top"></div><div class="p-5 text-slate-900"><div class="flex justify-between mb-5"><div><small class="font-black text-slate-500">WayPAY</small><h3 class="font-black text-xl">${t}</h3></div><div class="w-11 h-11 rounded-xl grid place-items-center" style="background:${l};color:${a}"><i class="fa ${ic}"></i></div></div><div class="rounded-2xl bg-slate-50 p-4 mb-4"><b>Vælg ydelse</b><div class="h-2 rounded-full mt-3" style="background:${l}"></div></div><div class="rounded-2xl bg-slate-50 p-4 mb-4"><b>Betal sikkert</b><div class="h-2 rounded-full mt-3" style="background:${l}"></div></div><button class="w-full rounded-2xl text-white py-4 font-black" style="background:${a}">Book og betal</button></div></div></div><div><span class="pill">Løsningen</span><h2 class="fade mt-6 text-5xl md:text-6xl font-black leading-none">WayPAY samler booking, betaling og beskeder.</h2><p class="fade mt-6 text-xl text-slate-300">Kunden gør mere selv, mens virksomheden får bedre overblik og mindre manuel opfølgning.</p></div></div></section>`,`<section class="scene active bg-white"><div class="max-w-7xl w-full"><div class="text-center max-w-4xl mx-auto"><span class="pill">Infografik</span><h2 class="fade mt-6 text-5xl md:text-6xl font-black leading-none">Fire trin, der er lette at forstå</h2></div><div class="info mt-12"><div class="grid md:grid-cols-4 gap-4">${['Vælg ydelse','Vælg tid','Betal sikkert','Få bekræftelse'].map((s,i)=>`<div class="node fade"><div class="num">${i+1}</div><b>${s}</b><p class="text-sm text-slate-300 mt-2">Klar kunderejse</p></div>`).join('')}</div></div></div></section>`,`<section class="scene active" style="background:${l}"><div class="max-w-6xl text-center"><span class="pill">SEO + AEO</span><h2 class="fade mt-6 text-5xl md:text-7xl font-black leading-none">Bygget til både mennesker og AI-søgning</h2><p class="fade mt-7 text-xl text-slate-600 max-w-3xl mx-auto">Hver explainer har klar quick answer, HowTo-flow, FAQ-tænkning, brancheord og visuelle argumenter.</p></div></section>`,`<section class="scene active text-white" style="background:linear-gradient(135deg,${a},#059669)"><div class="max-w-5xl text-center"><div class="fade w-20 h-20 mx-auto bg-white rounded-3xl grid place-items-center" style="color:${a}"><i class="fa fa-rocket text-4xl"></i></div><h2 class="fade mt-8 text-5xl md:text-7xl font-black leading-none">Klar til at bruge WayPAY?</h2><p class="fade mt-6 text-2xl text-white/90">Denne statiske HTML explainer kan kopieres til hver branche og feature.</p><button onclick="scene=0;show()" class="mt-10 bg-white rounded-2xl px-8 py-5 font-black text-xl" style="color:${a}">Afspil igen</button></div></section>`]}function show(){clearTimeout(timer);clearInterval(pt);app.innerHTML=shell()+scenes()[scene];voice.textContent=[cur[5],cur[6],'WayPAY samler booking, betaling og beskeder.','Kunderejsen forklares som en enkel infografik.','Explaineren er SEO og AEO friendly.','Brug den som statisk HTML på WayPAY.'][scene];let w=0;bar.style.width='0%';if(play){pt=setInterval(()=>{w+=1.55;bar.style.width=Math.min(w,100)+'%'},100);timer=setTimeout(()=>{scene<5?(scene++,show()):(play=false,pb.innerHTML='<i class="fa fa-play"></i>')},6500)}}function next(){scene=Math.min(5,scene+1);show()}function prev(){scene=Math.max(0,scene-1);show()}function toggle(){play=!play;pb.innerHTML=play?'<i class="fa fa-pause"></i>':'<i class="fa fa-play"></i>';show()}overview();</script></body></html>
